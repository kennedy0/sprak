[project]
name = "sprak"
version = "2.0.4"
description = "A pixel art sprite packing tool"
readme = "README.md"
authors = [
    { name = "akennedy", email = "andrewjacobkennedy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3",
]

[project.scripts]
sprak = "sprak.cli:main"

[project.urls]
Homepage = "https://github.com/kennedy0/sprak"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["N"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pydantic>=2.13.5",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
